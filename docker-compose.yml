# ============================================================
# Raj Mobile & Electrics — Production Docker Compose
# ============================================================
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up -d
#
# Services:
#   frontend  → http://<your-vps-ip>       (port 80)
#   backend   → http://<your-vps-ip>:5000  (port 5000)
#   postgres  → internal only              (port 5432)
#   redis     → internal only              (port 6379)
# ============================================================

version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rajmobile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rajmobile}
      POSTGRES_USER: ${POSTGRES_USER:-rajmobile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rajmobile} -d ${POSTGRES_DB:-rajmobile}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rajmobile-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rajmobile-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rajmobile}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rajmobile}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    ports:
      - '5000:5000'
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Run migrations then start
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  # ── Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the frontend at the VPS backend
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: rajmobile-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy

# ── Volumes ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ─────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true   # postgres & redis not reachable from outside
  public:
    driver: bridge
